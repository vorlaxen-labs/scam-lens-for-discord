name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm approve-builds better-sqlite3 sharp esbuild
      - run: pnpm rebuild better-sqlite3 sharp
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
